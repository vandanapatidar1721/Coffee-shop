<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
    
</head>

<body>
    <header>
        <nav class="navbar flex">
            <a href="#" class="logo">COFFEE<span>SHOP</span></a>
            <ul class="navlist flex container">
                <li><a href="index.html" class="link ">HOME</a></li>
                <li><a href="about.html" class="link link-active">ABOUT</a></li>
                <li><a href="MENU.html" class="link">MENU</a></li>
                <li><a href="service.html" class="link">SERVICE</a></li>
                <li><a href="contact.html" class="link">CONTACT US</a></li>
                <li class="nav-icons flex">
                    <!-- serch bar -->
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Search here..." />
                        <button onclick="searchFunction()">Search</button>
                    </div>
                    <!-- Menu Icon -->
                    <div id="menu-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <!-- Hidden Login Modal -->
                    <div id="login-modal" class="hidden">
                        <div class="login-box">
                            <h2>Login</h2>
                            <input type="text" placeholder="Username" />
                            <input type="password" placeholder="Password" />
                            <button>Login</button>
                        </div>
                    </div>
  <!-- fav icon -->
                    <a href="#" id="fav-icon" class="icon">
                        <i class="fa-solid fa-heart"></i>
                        <span id="fav-item-count">0</span>
                    </a>
                    <!-- Favorite Sidebar -->
                    <div id="fav-sidebar" class="fav-sidebar">
                        <button id="close-fav-btn" class="close-cart"><i class="fa-solid fa-xmark"></i></button>
                        <h2>Your Favorites</h2>
                        <div id="fav-items-container" class="cart-items-container"></div>
                    </div>


                    <!-- shoppping icon -->
                    <a href="#" id="cart-icon" class="icon icon-active">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span id="cart-item-count">0</span>
                    </a>
                    <!-- Cart Icon in Navbar -->
                    <div id="cart-overlay" class="cart-overlay"></div>
                    <div id="cart-sidebar" class="cart-sidebar">
                        <button id="close-cart-btn" class="close-cart"><i class="fa-solid fa-xmark"></i></button>
                        <h2>Your Cart</h2>
                        <div id="cart-items-container" class="cart-items-container"></div>
                        <p class="total-price">Total: $<span id="cart-total-price">0.00</span></p>
                    </div>

                </li>
            </ul>
            <a href="#" class="hamburger"><i class="fa-solid fa-bars"></i></a>
   
        </nav>
    </header>
  <!-- Include header -->
  <header>...header code here...</header>

  <section class="services-section">
    <h2>OUR MENU</h2>
   <img src="menu4.webp" alt="menu4.webp"width=100%
   >
  </section>
 <script src="script.js"></script>
</body>
</html>
